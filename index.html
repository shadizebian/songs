<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Song</title>
<style>
:root{color-scheme:dark;--bg:#101322;--card:#1b2035;--accent:#a5f3cf;--muted:#aab3ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#283458,var(--bg) 65%);color:white;font-family:Inter,system-ui,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:24px}.game{width:min(100%,720px);text-align:center}.eyebrow{color:var(--accent);letter-spacing:.2em;font-weight:800;font-size:13px;text-transform:uppercase}h1{font-size:clamp(28px,5vw,44px);margin:12px 0 6px}.hint{color:var(--muted);margin:0 0 32px}.panel{background:rgba(27,32,53,.93);border:1px solid #3b4666;border-radius:28px;padding:clamp(26px,6vw,56px) 22px;box-shadow:0 20px 65px #0005}.counter{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.word{font-size:clamp(54px,11vw,100px);font-weight:850;letter-spacing:-.05em;overflow-wrap:anywhere;margin:32px 0 40px;line-height:1.05}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}button{border:0;border-radius:14px;padding:16px 24px;font-size:16px;font-weight:750;cursor:pointer;min-width:150px;transition:transform .15s,filter .15s}button:disabled{opacity:.4;cursor:not-allowed}button:disabled:hover{transform:none;filter:none}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:focus-visible{outline:3px solid white;outline-offset:3px}.play{background:var(--accent);color:#14251e}.next{background:#5366e7;color:white}.secondary{background:#303a58;color:white}.status{color:var(--muted);min-height:25px;margin:22px 0 0;font-size:14px}.footer{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}.footer button{padding:11px 17px;min-width:auto;font-size:14px}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer}.toggle input{accent-color:var(--accent);width:17px;height:17px}.hidden{display:none}audio{width:min(100%,420px);margin:16px auto 0;display:block}.instructions{color:var(--muted);font-size:12px;line-height:1.6;margin:22px auto 0;max-width:550px}code{color:#d7ffe8}
</style>
</head>
<body>
<main class="game"><h1>أنا مش كينغ كونغ<br>I Guess the Song</h1><section class="panel"><div id="counter" class="counter">Round 1</div><div id="word" class="word" aria-live="polite">Loading...</div><div class="actions"><button id="back" class="secondary">← Back</button><button id="play" class="play">▶ Play Song</button><button id="next" class="next">Next →</button></div><audio id="player" controls preload="none" class="hidden"></audio><p id="status" class="status" aria-live="polite"></p></section></main>
<script src="songs.js"></script>
<script>
(function(){
const wordEl=document.getElementById('word'),counter=document.getElementById('counter'),status=document.getElementById('status'),player=document.getElementById('player'),play=document.getElementById('play'),next=document.getElementById('next'),back=document.getElementById('back');
let rounds=[],position=0;
const library=typeof SONGS!=='undefined'&&Array.isArray(SONGS)?SONGS.filter(s=>s&&typeof s.word==='string'&&typeof s.audio==='string'&&s.word.trim()&&s.audio.trim()):[];
function resetAudio(){player.pause();player.removeAttribute('src');player.load();player.classList.add('hidden');play.textContent='▶ Play Song';}
function render(){resetAudio();if(!rounds.length){wordEl.textContent='No songs yet';counter.textContent='Setup needed';status.textContent='';play.disabled=true;next.disabled=true;back.disabled=true;return;}play.disabled=false;next.disabled=false;back.disabled=position===0;if(position>=rounds.length){wordEl.textContent='Well played!';counter.textContent='Game complete';status.textContent=`You finished all ${rounds.length} rounds. `;play.disabled=true;next.disabled=true;back.disabled=false;return;}const song=rounds[position];wordEl.textContent=song.word;counter.textContent=`Round ${position+1} of ${rounds.length}`;status.textContent='Think of a song before revealing the audio.';}
function start(){rounds=[...library];position=0;render();}
play.addEventListener('click',async()=>{if(position>=rounds.length)return;const song=rounds[position];if(!player.getAttribute('src')){player.src='audio/'+song.audio;player.classList.remove('hidden');}if(!player.paused){player.pause();play.textContent='▶ Resume Song';status.textContent='Paused.';return;}try{await player.play();play.textContent='Ⅱ Pause Song';status.textContent='Song revealed!';}catch(e){play.textContent='▶ Play Song';status.textContent='Audio could not play. Check that audio/'+song.audio+' exists and is a supported audio file.';}});
player.addEventListener('ended',()=>{play.textContent='▶ Replay Song';});player.addEventListener('error',()=>{if(player.getAttribute('src'))status.textContent='Audio file missing or unsupported. Check the filename in songs.js.';});
next.addEventListener('click',()=>{position++;render();});back.addEventListener('click',()=>{if(position>0){position--;render();}});document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'&&!next.disabled)next.click();if(e.key==='ArrowLeft'&&!back.disabled)back.click();});start();
})();
</script></body></html>
